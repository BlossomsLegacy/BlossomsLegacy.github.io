<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAVEN CREATED 2 BLOSSOM L.L.C. | Blossoms Legacy</title>
    <style>
        /* CORE RESET & TYPOGRAPHY */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Playfair Display', 'Helvetica Neue', serif;
        }

        :root {
            --royal-blue: #000B26;
            --deep-navy: #04143a;
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #AA7C11;
            --text-pure: #FFFFFF;
            --text-muted: #E0E6ED;
        }

        body {
            background-color: var(--royal-blue);
            color: var(--text-pure);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* PRESTIGIOUS PAGE ACCENT BORDERS */
        .page-border {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            pointer-events: none;
            z-index: 100;
        }

        /* NAVIGATION BAR */
        header {
            position: absolute;
            top: 40px;
            left: 60px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-left: 35px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--gold-primary);
        }

        /* CINEMATIC HERO ZONE */
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 40px;
            position: relative;
            background: radial-gradient(circle at center, var(--deep-navy) 0%, var(--royal-blue) 70%);
        }

        .logo-container {
            margin-bottom: 35px;
            animation: fadeIn 2s ease-in-out;
        }

        .logo-image {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4));
        }

        .hero-tagline {
            font-size: 1.1rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold-primary);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .hero-headline {
            font-size: 3.8rem;
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: 2px;
            max-width: 1100px;
            margin-bottom: 45px;
            text-transform: uppercase;
        }

        .hero-headline span {
            display: block;
            font-weight: 700;
            background: linear-gradient(135deg, #FFF, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 12px;
        }

        /* SPONSOR ENGAGEMENT BUTTONS */
        .cta-group {
            display: flex;
            gap: 20px;
            z-index: 5;
        }

        .btn-primary {
            display: inline-block;
            padding: 18px 40px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: var(--royal-blue);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
        }

        .btn-secondary {
            display: inline-block;
            padding: 18px 40px;
            background: transparent;
            color: var(--text-pure);
            border: 1px solid rgba(212, 175, 55, 0.5);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold-primary);
            color: var(--gold-light);
        }

        /* CORPORATE BRAND MODEL VISUAL SHOWCASE */
        .model-showcase-section {
            padding: 120px 40px;
            background-color: var(--royal-blue);
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
        }

        .section-title {
            color: var(--gold-primary);
            font-size: 2.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 60px;
        }

        .model-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .model-card {
            background: var(--deep-navy);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 25px;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .model-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
        }

        .model-img {
            width: 100%;
            height: auto;
            max-height: 550px;
            object-fit: cover;
            border: 1px solid rgba(212, 175, 55, 0.15);
            margin-bottom: 20px;
        }

        .model-caption {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-light);
            font-weight: 600;
        }

        /* STRATEGIC MISSION INTENTION SECTION */
        .vision-section {
            padding: 140px 80px;
            background-color: var(--deep-navy);
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            justify-content: center;
        }

        .vision-container {
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .vision-text-block h2 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            color: var(--gold-primary);
        }

        .vision-text-block p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            text-align: justify;
        }

        .vision-accent-box {
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 50px;
            background: rgba(0, 11, 38, 0.4);
            position: relative;
        }

        .vision-accent-box::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 20px;
            height: 20px;
            border-top: 2px solid var(--gold-primary);
            border-left: 2px solid var(--gold-primary);
        }

        .vision-accent-quote {
            font-size: 1.5rem;
            font-style: italic;
            color: var(--text-pure);
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 968px) {
            header { left: 40px; right: 40px; }
            .hero-headline { font-size: 2.5rem; }
            .vision-container { grid-template-columns: 1fr; gap: 40px; }
            .vision-section { padding: 80px 40px; }
        }
    </style>
</head>
<body>

    <div class="page-border"></div>

    <header>
        <div class="brand-title">Blossoms Legacy</div>
        <nav>
            <a href="#story">Our Story</a>
            <a href="#work">Our Work</a>
            <a href="#representation">Representation</a>
            <a href="#connect">Connect</a>
        </nav>
    </header>

    <section class="hero-section">
        <div class="logo-container">
            <!-- Linked directly to your primary crown asset file from your repository root -->
            <img src="Golden Blossoms Legacy Crown Emblem (1).png" alt="Blossoms Legacy Crown" class="logo-image">
        </div>
        
        <p class="hero-tagline">HEAVEN CREATED 2 BLOSSOM L.L.C.</p>
        
        <h1 class="hero-headline">
            Heaven has literally touched Earth,
            <span>And everything meant to flourish is here.</span>
        </h1>
