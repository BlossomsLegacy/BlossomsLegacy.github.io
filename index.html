<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#241426">
<meta name="description" content="Heaven Created 2 BLOSSOM L.L.C. — Blossoms Legacy. Family, services, community outreach, modeling, partnerships, and a future worth growing.">
<title>Blossoms Legacy | Heaven Created 2 BLOSSOM L.L.C.</title>

<style>
:root {
  --plum: #241426;
  --plum-light: #49304a;
  --gold: #d8b878;
  --gold-light: #f0dba8;
  --cream: #fbf6ed;
  --white: #fffdf8;
  --ink: #302632;
  --muted: #716672;
  --line: #e7dcca;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 90px; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.7;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
.container { max-width: 1120px; margin: auto; }
.announcement {
  background: var(--plum);
  color: var(--gold-light);
  text-align: center;
  padding: 9px 15px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255,253,248,.97);
  border-bottom: 1px solid var(--line);
}
.nav {
  max-width: 1200px;
  margin: auto;
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--plum);
  font-family: Georgia, serif;
  font-weight: bold;
  line-height: 1.2;
}
.brand img { width: 65px; height: 58px; object-fit: contain; }
.brand small {
  display: block;
  margin-top: 5px;
  font: 10px Arial, sans-serif;
  letter-spacing: 1.5px;
  color: #987644;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.nav-links a {
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}
.nav-links a:hover { color: #987644; }
.nav-links .nav-button { background: var(--plum); color: white; padding: 10px 14px; }
.hero {
  color: var(--cream);
  background:
    radial-gradient(ellipse at 85% 15%, rgba(216,184,120,.2), transparent 30%),
    linear-gradient(125deg, #201222, #49304a);
  padding: 80px 24px;
}
.hero-grid {
  max-width: 1120px;
  margin: auto;
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 50px;
  align-items: center;
}
.kicker {
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #987644;
}
.hero .kicker { color: var(--gold-light); }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; }
h1 {
  font-size: clamp(42px, 6vw, 72px);
  line-height: 1.06;
  font-weight: normal;
  margin: 18px 0;
}
h1 em { color: var(--gold-light); font-style: normal; }
.hero p { color: #eee2ed; max-width: 650px; }
.hero-image {
  background: var(--white);
  padding: 22px;
  border: 1px solid var(--gold);
  box-shadow: 0 20px 60px #0005;
}
.hero-image img { width: 100%; max-height: 360px; object-fit: contain; }
.hero-image p {
  color: var(--plum);
  text-align: center;
  font-family: Georgia, serif;
  margin: 15px 0 0;
}
.buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 25px; }
.button {
  display: inline-block;
  background: var(--gold);
  color: var(--plum);
  padding: 13px 18px;
  border: 1px solid var(--gold);
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}
.button:hover { background: var(--gold-light); }
.button.outline { background: transparent; color: white; border-color: #ffffff88; }
.button.dark { background: var(--plum); color: white; border-color: var(--plum); }
.proof {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: #fffaf1;
  border-bottom: 1px solid var(--line);
}
.proof div { text-align: center; padding: 22px 10px; border-right: 1px solid var(--line); }
.proof strong { display: block; font: 20px Georgia, serif; color: var(--plum); }
.proof span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
section { padding: 78px 24px; }
.section-title {
  color: var(--plum);
  font-size: clamp(32px, 4vw, 49px);
  font-weight: normal;
  line-height: 1.15;
  margin: 12px 0 18px;
}
.lead { font-size: 17px; color: var(--muted); max-width: 780px; }
.two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 45px; align-items: center; }
.quote {
  background: var(--cream);
  border: 1px solid var(--line);
  border-left: 4px solid var(--gold);
  padding: 30px;
}
.quote blockquote {
  margin: 0 0 15px;
  color: var(--plum);
  font: 25px/1.4 Georgia, serif;
}
.cream-section { background: var(--cream); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; margin-top: 32px; }
.card { background: white; border: 1px solid var(--line); padding: 25px; }
.card .number { color: #987644; font-size: 11px; letter-spacing: 2px; font-weight: bold; }
.card h3 { font-size: 24px; line-height: 1.2; font-weight: normal; color: var(--plum); margin: 12px 0; }
.card p { color: var(--muted); font-size: 14px; margin-bottom: 0; }
.plum-section { background: var(--plum); color: var(--cream); }
.plum-section .section-title { color: var(--cream); }
.plum-section .kicker { color: var(--gold-light); }
.plum-section p { color: #e5d9e4; }
.pills { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 22px; }
.pills span { border: 1px solid #d8b87888; color: var(--gold-light); padding: 7px 11px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
.modeling { background: #fffdf8; }
.model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 35px 0 22px; }
.model-card { margin: 0; border: 1px solid var(--line); background: white; padding: 14px; }
.model-card img {
  width: 100%;
  height: 430px;
  object-fit: contain;
  background: #f5efe6;
}
.model-card figcaption { padding: 17px 7px 8px; }
.model-card figcaption strong { display: block; color: var(--plum); font: 21px Georgia, serif; }
.model-card figcaption span { display: block; color: var(--muted); font-size: 13px; margin-top: 5px; }
.note { font-size: 12px; color: var(--muted); }
.opportunity { background: var(--plum); color: white; }
.opportunity .card { color: var(--ink); }
.opportunity .card.featured { background: #39213a; border-color: var(--gold); }
.opportunity .featured h3 { color: white; }
.opportunity .featured p { color: #eee2ed; }
.opportunity .featured .number { color: var(--gold-light); }
.community { background: #f4eadb; }
.list { padding-left: 20px; }
.list li { padding: 7px 0; }
.social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 30px; }
.social-card { border: 1px solid var(--line); padding: 25px; background: white; }
.social-card h3 { color: var(--plum); font-size: 25px; font-weight: normal; margin-bottom: 5px; }
.social-card p { color: var(--muted); font-size: 14px; }
.social-card a { color: #77572e; font-weight: bold; font-size: 13px; }
.contact { background: var(--cream); }
.contact-box { background: white; padding: 30px; border: 1px solid var(--line); }
.contact-box h3 { color: var(--plum); font-size: 28px; font-weight: normal; }
.contact-item { display: block; padding: 16px 0; border-bottom: 1px solid var(--line); text-decoration: none; overflow-wrap: anywhere; }
.contact-item span { display: block; font-size: 12px; color: var(--muted); }
.contact-item strong { color: var(--plum); }
footer { background: #1c101e; color: #e8dce7; text-align: center; padding: 40px 20px; font-size: 12px; }
footer strong { font: 23px Georgia, serif; color: var(--gold-light); }
.footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 17px; margin: 20px 0; }
.footer-links a { color: var(--gold-light); text-decoration: none; }
@media(max-width: 850px) {
  .nav { align-items: flex-start; flex-direction: column; }
  .nav-links { gap: 12px; }
