<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEAVEN CREATED 2 BLOSSOM L.L.C.</title>
    
    <!-- Google Fonts for High-End Corporate Typography -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* Modern Reset & Premium Variables */
        :root {
            --bg-main: #030712;
            --bg-card: rgba(15, 23, 42, 0.6);
            --border-color: rgba(212, 175, 55, 0.2);
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa841c 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Subtle Luxury Background Grid Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(11, 34, 101, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            z-index: -1;
        }

        /* Hero Wrapper */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px 40px 24px;
            text-align: center;
        }

        .logo-wrapper {
            margin-bottom: 35px;
            position: relative;
            display: inline-block;
        }

        .logo-wrapper img {
            max-width: 100%;
            height: auto;
            width: 220px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            padding: 6px;
            background: rgba(3, 7, 18, 0.8);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.25);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-wrapper img:hover {
            transform: scale(1.03) rotate(2deg);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(to right, #ffffff 40%, #f3e5ab 70%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        header .enterprise-tag {
            font-size: 1.15rem;
            color: var(--gold-primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 40px;
        }

        /* Main Structural Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 100px 24px;
        }

        /* Credentials Pills Deck */
        .cred-deck {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }

        .cred-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
        }

        .cred-pill span {
            color: var(--gold-primary);
        }

        /* Twin Master Panels Layout */
        .grid-master {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 40px;
            margin-bottom: 60px;
        }

        @media (max-width: 968px) {
            .grid-master { grid-template-columns: 1fr; }
            header h1 { font-size: 2.4rem; }
        }

        /* Panel Glassmorphism Cards */
        .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 50px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .panel-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--gold-gradient);
        }

        .panel-card h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .panel-card p {
            color: var(--text-main);
            font-size: 1.15rem;
            line-height: 1.8;
            font-weight: 300;
        }

        /* Metric Bullet Framework */
        .framework-list {
            list-style: none;
            margin-top: 30px;
        }

        .framework-list li {
            position: relative;
            padding-left: 30px;
            margin-bottom: 20px;
            font-size: 1.05rem;
            color: var(--text-muted);
        }

        .framework-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--gold-primary);
            font-weight: 900;
        }

        .framework-list strong {
            color: #ffffff;
        }

        /* High-Impact Institutional Call to Action Box */
        .funding-cta {
            background: linear-gradient(135deg, rgba(11, 34, 101, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 24px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }

        .funding-cta h3 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .funding-cta p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 35px auto;
            font-weight: 300;
        }

        /* Venture-Grade Interactive Action Buttons */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--gold-gradient);
            color: #030712;
            padding: 18px 45px;
            font-size: 1rem;
            font-weight: 800;
            text-decoration: none;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
            background: #ffffff;
        }

        .btn-secondary {
            background: transparent;
            color: #ffffff;
            padding: 18px 45px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-secondary:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.05);
        }

        /* Footer Accent */
        footer {
            text-align: center;
            padding: 50px 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: #4b5563;
            font-size: 0.9rem;
            letter-spacing: 1px;
            font-weight: 500;
        }
    </style>
</head>

        <h1>HEAVEN CREATED 2 BLOSSOM L.L.C.</h1>
        <div class="enterprise-tag">Blossom's Legacy Enterprise</div>

    <div class="container">

        <div class="cred-deck">

            <div class="cred-pill">🔑 DVN: <span>#002957439</span></div>
            <div class="cred-pill">📍 HQ: <span>Columbia, MO</span></div>

        <!-- Corporate Profile Layout -->
        <div class="grid-master">
            
            <!-- Left Wing: Core Foundation -->
            <div class="panel-card">
                <h2>Our Corporate Foundation & Core Vision</h2>
